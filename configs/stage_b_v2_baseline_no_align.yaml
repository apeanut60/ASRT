# Same clean B-v2 split, Query alignment OFF (ablation baseline).
# Do not compare against old Stage B (different Dev / leakage).
stage: b
out_dir: /root/data/experiments/ASRT/stage_b_v2_no_align
seed: 42
max_steps: 100000
total_steps: 100000
batch_size: 8
accum: 1
lr: 1.0e-5
lr_backbone: 1.0e-5
lr_inject: 1.0e-4
lr_igab: 2.0e-5
lr_illum: 2.0e-5
eta_min: 1.0e-6
amp: true
grad_clip: 1.0
crop: 256
crop_syn: 128
no_ref_prob: 0.25
log_every: 50
eval_every: 2000
save_every: 2000
eval_limit: 0
workers: 2
pretrained: /root/data/experiments/ASRT/stage_a/checkpoints/best.pt
model:
  num_res_blocks: "8+8+4+2"
  n_feats: 64
  freeze_lte: true
  use_global_illum: false
  use_ref_illum: false
  enable_lightup: true
query_alignment:
  enabled: false
  method: gamma_hist
  gamma_alpha: 0.75
  hist_beta: 0.50
  gamma_min: 0.3
  gamma_max: 1.0
  hist_bins: 256
  stats_scope: full_image
data:
  manifest_root: /root/data/experiments/ASRT/manifests_b_v2
