stage: b
out_dir: /root/data/experiments/ASRT/stage_b_v2
seed: 42
max_steps: 100000
total_steps: 100000
batch_size: 8
accum: 1
lr: 1.0e-5
lr_backbone: 1.0e-5
lr_inject: 1.0e-4
lr_igab: 2.0e-5
lr_illum: 2.0e-5
eta_min: 1.0e-6
amp: true
grad_clip: 1.0
crop: 256
crop_syn: 128
no_ref_prob: 0.25
log_every: 50
eval_every: 2000
save_every: 2000
eval_limit: 0
workers: 2
# Fresh start from Stage A 58k best — do NOT resume old Stage B
pretrained: /root/data/experiments/ASRT/stage_a/checkpoints/best.pt
model:
  num_res_blocks: "8+8+4+2"
  n_feats: 64
  freeze_lte: true
  use_global_illum: false
  use_ref_illum: false
  enable_lightup: true
query_alignment:
  enabled: true
  method: gamma_hist
  # Provenance: TTSR-lowlight-v1-data1SOTA v1r7 / v2_p2 working recipe (alpha=0.75, beta=0.50).
  # Task fallback beta=0.20 was NOT used because historical effective beta=0.50 is recoverable.
  gamma_alpha: 0.75
  hist_beta: 0.50
  gamma_min: 0.3
  gamma_max: 1.0
  hist_bins: 256
  stats_scope: full_image
data:
  manifest_root: /root/data/experiments/ASRT/manifests_b_v2
  real_low: /root/data/datasets/lol-v2-real/Train/Low
  real_gt: /root/data/datasets/lol-v2-real/Train/Normal
  real_ref: /root/data/datasets/lol-v2-real/Train/nanobanana_ref_v2
  syn_low: /root/data/datasets/lol-v2-synthetic/Train/Low
  syn_gt: /root/data/datasets/lol-v2-synthetic/Train/Normal
  syn_ref: /root/data/datasets/lol-v2-synthetic/Train/nanobanana_ref
  noref_real_low: /root/data/datasets/lol-v2-real/Train/Low
  noref_real_gt: /root/data/datasets/lol-v2-real/Train/Normal
  noref_syn_low: /root/data/datasets/lol-v2-synthetic/Train/Low
  noref_syn_gt: /root/data/datasets/lol-v2-synthetic/Train/Normal
  dev_frac: 0.05
